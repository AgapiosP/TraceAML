[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "traceaml"
version = "0.3.0rc1"
description = "Local-first financial-crime investigation and control-validation platform"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "TraceAML contributors" }]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Programming Language :: Python :: 3",
  "Topic :: Office/Business :: Financial",
]
dependencies = ["cryptography>=50,<51", "fastapi>=0.115,<1", "uvicorn>=0.34,<1"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.9,<1", "httpx>=0.28,<1"]

[project.scripts]
traceaml = "traceaml.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
traceaml = ["packs/*.json", "web/*.html", "web/*.css", "web/*.js"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

